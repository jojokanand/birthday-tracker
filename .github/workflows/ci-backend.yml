name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
      - ".python-version"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
      - ".python-version"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin Python via the repo-root .python-version so CI matches local pyenv.
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest -m unit

      - name: Build docs (Sphinx, warnings-as-errors)
        run: uv run sphinx-build -W -b html docs docs/_build/html

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      # Firestore emulator requires Java 21+.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Cloud SDK with Firestore emulator
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: cloud-firestore-emulator

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Start Firestore emulator
        run: |
          gcloud emulators firestore start --host-port=localhost:8085 &
          # Wait for the emulator to accept connections (max 60s).
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8085 >/dev/null 2>&1; then
              echo "Firestore emulator ready."
              exit 0
            fi
            sleep 1
          done
          echo "Firestore emulator failed to start within 60s." >&2
          exit 1

      - name: Integration tests
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8085
        run: uv run pytest -m integration
