name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

# These vars are set in the GitHub repo → Settings → Variables (Actions).
# Secrets are set in Settings → Secrets → Actions.
env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  # Full Artifact Registry host, e.g. us-central1-docker.pkg.dev/my-project/birthday-tracker
  REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
  BACKEND_SERVICE: birthday-tracker-backend
  FRONTEND_SERVICE: birthday-tracker-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Skip the entire job when GCP has not been provisioned yet (variables unset).
    # Once the variables in Settings → Actions → Variables are populated the
    # job will run automatically on the next push to main.
    if: vars.GCP_PROJECT_ID != ''

    # id-token:write is required for Workload Identity Federation.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Authenticate to GCP via Workload Identity Federation (no JSON key).
      # -----------------------------------------------------------------------
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Trim whitespace from URL-shaped variables. Values pasted from the
      # gcloud CLI / GCP console sometimes carry a leading space; without
      # trimming, the docker build arg below splits into two positional
      # args and fails with "docker buildx build requires 1 argument".
      - name: Normalize URL variables
        id: urls
        env:
          RAW_BACKEND_URL: ${{ vars.BACKEND_URL }}
          RAW_FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          backend=$(printf '%s' "$RAW_BACKEND_URL" | xargs)
          frontend=$(printf '%s' "$RAW_FRONTEND_URL" | xargs)
          echo "backend=${backend:-http://localhost:8000}" >> "$GITHUB_OUTPUT"
          echo "frontend=${frontend:-http://localhost:3000}" >> "$GITHUB_OUTPUT"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # -----------------------------------------------------------------------
      # Backend — build & push
      # -----------------------------------------------------------------------
      - name: Build backend image
        run: |
          docker build \
            -f infra/Dockerfile.backend \
            -t ${{ env.REGISTRY }}/backend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/backend:latest \
            .

      - name: Push backend image
        run: |
          docker push ${{ env.REGISTRY }}/backend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/backend:latest

      # -----------------------------------------------------------------------
      # Frontend — build & push (API URL baked in at build time)
      # -----------------------------------------------------------------------
      - name: Build frontend image
        run: |
          docker build \
            -f infra/Dockerfile.frontend \
            --build-arg "NEXT_PUBLIC_API_URL=${{ steps.urls.outputs.backend }}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
            --build-arg "NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}" \
            --build-arg "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}" \
            -t ${{ env.REGISTRY }}/frontend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/frontend:latest \
            .

      - name: Push frontend image
        run: |
          docker push ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/frontend:latest

      # -----------------------------------------------------------------------
      # Deploy backend to Cloud Run
      # -----------------------------------------------------------------------
      # Run as the deploy SA so the revision has Secret Manager + Firestore
      # access (granted in infra/README step 5). Without this, Cloud Run uses
      # the default Compute Engine SA, which is denied access to our secrets.
      - name: Deploy backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.BACKEND_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/backend:${{ github.sha }}
          flags: --service-account=${{ vars.GCP_SERVICE_ACCOUNT }}
          env_vars: |
            APP_ENV=production
            GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            PUBLIC_BASE_URL=${{ steps.urls.outputs.frontend }}
          secrets: |
            TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest
            GMAIL_OAUTH_TOKEN=GMAIL_OAUTH_TOKEN:latest
            FORM_TOKEN_SECRET=FORM_TOKEN_SECRET:latest

      # -----------------------------------------------------------------------
      # Deploy frontend to Cloud Run
      # -----------------------------------------------------------------------
      - name: Deploy frontend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.FRONTEND_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          flags: --service-account=${{ vars.GCP_SERVICE_ACCOUNT }}
