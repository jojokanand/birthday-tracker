[project]
name = "birthday-tracker"
version = "0.1.0"
description = "Personal birthday tracker — collects contact details via SMS/email, stores in Firestore, surfaces in a Next.js dashboard."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "jyothsnakanand", email = "jyothsnapk17@gmail.com" }]

# Runtime dependencies. Pinned loosely; uv.lock is the source of truth for reproducibility.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "google-cloud-firestore>=2.19,<3.0",
    "google-cloud-secret-manager>=2.21,<3.0",
    "firebase-admin>=6.5,<7.0",                # Firebase Auth ID token verification

    "google-api-python-client>=2.150,<3.0",   # Gmail API
    "google-auth-oauthlib>=1.2,<2.0",         # Gmail OAuth flow
    "twilio>=9.3,<10.0",
    "httpx>=0.28,<1.0",
    "python-dotenv>=1.0,<2.0",
    "structlog>=24.4,<26.0",
    "email-validator>=2.2,<3.0",       # for pydantic.EmailStr
    "phonenumbers>=8.13,<9.0",         # E.164 validation
]

[project.optional-dependencies]
# Test deps installed via `uv sync --extra dev`.
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
    "sphinx>=8.1,<9.0",
    "sphinx-rtd-theme>=3.0,<4.0",
    "sphinx-autodoc-typehints>=3.0,<4.0",
    "autodoc-pydantic>=2.2,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birthday_tracker"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E,F=pycodestyle/pyflakes, I=isort, B=bugbear, UP=pyupgrade, D=pydocstyle (Google style)
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D213"]  # conflicting docstring rules; we use D211 + D212 by default

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers belong in default arguments — that's the framework's pattern.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # tests don't need full docstring coverage

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "twilio.*", "firebase_admin.*"]
ignore_missing_imports = true

# ---------- pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=birthday_tracker",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
testpaths = ["tests"]
markers = [
    "unit: fast, no I/O",
    "integration: requires Firestore emulator or other external test deps",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["birthday_tracker"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
